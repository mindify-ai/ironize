name: Code review

# Automated review of every pull request by Claude, focused on correctness and
# security. Needs the ANTHROPIC_API_KEY repository secret (or
# CLAUDE_CODE_OAUTH_TOKEN); without one the job is skipped, not failed.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude review
    # Secrets are not available to fork PRs; drafts are reviewed once ready.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Check for credentials
        id: creds
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret; skipping Claude review."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.creds.outputs.ok == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@70f88a9fad3080e3383237f821b29116898c9cf4 # v1.0.262
        if: steps.creds.outputs.ok == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request to Ironize, a Rust AI agent harness and
            terminal UI that signs in to Mindify Cortex, stores a session token
            on disk, and runs shell commands, file edits and web fetches for an
            LLM. Read the diff with `gh pr diff` and the surrounding code as needed.

            Report only real problems, most severe first:
            1. Correctness: logic errors, panics/unwraps on reachable paths,
               async cancellation and process-cleanup bugs, broken error handling.
            2. Security: token or secret leakage (logs, Debug output, errors,
               redirects), token sent over plain HTTP, weakened file permissions
               on the session file, path traversal outside the working directory,
               shell/command injection, tools bypassing the permission prompt,
               unsafe deserialization, new dependencies with a poor track record.
            3. Tests: behavior changes without a test that would catch a regression.

            Skip style nits that `cargo fmt` and `cargo clippy` already enforce.
            Put each finding as an inline comment on the relevant line, with the
            concrete failure scenario and a suggested fix. Finish with one short
            top-level `gh pr comment` summarizing the verdict; if there are no
            findings, say so in one line.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
