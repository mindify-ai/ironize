[package]
name = "iron"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "An open-source, high-performance AI agent harness written in Rust, with first-class Mindify Cortex authentication."
license = "Apache-2.0"
repository = "https://github.com/mindify-ai/Iron"
readme = "README.md"

[lib]
name = "iron"
path = "src/lib.rs"

[[bin]]
name = "iron"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
open = "5"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "signal"] }
url = "2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
